name: Build Android APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show pre-installed tool versions
        run: |
          echo "Node: $(node -v)"
          echo "npm:  $(npm -v)"
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Ensure Java 17 is selected
        run: |
          JAVA17=$(ls -d /usr/lib/jvm/temurin-17* /usr/lib/jvm/*17* 2>/dev/null | head -1)
          if [ -z "$JAVA17" ]; then
            sudo apt-get update && sudo apt-get install -y openjdk-17-jdk
            JAVA17=$(ls -d /usr/lib/jvm/*17* | head -1)
          fi
          echo "JAVA_HOME=$JAVA17" >> "$GITHUB_ENV"
          echo "$JAVA17/bin" >> "$GITHUB_PATH"

      - name: Ensure Android SDK 35
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null 2>&1 || true
          fi

      - name: Compute version
        id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          BUILD=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "apk_name=pruvyou_v${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "Building PruvYou v${VERSION} (build ${BUILD}, commit ${SHORT_SHA})"

      - name: Install dependencies
        run: npm install

      - name: Patch expo-modules-core for SDK 35
        run: |
          F=node_modules/expo-modules-core/android/src/main/java/expo/modules/adapters/react/permissions/PermissionsService.kt
          if [ -f "$F" ]; then
            sed -i 's/return requestedPermissions\.contains(permission)/return requestedPermissions?.contains(permission) ?: false/' "$F"
            echo "Patched PermissionsService.kt"
          fi

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: 1

      - name: Set versionCode and versionName
        run: |
          GRADLE=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ steps.version.outputs.build }}/" "$GRADLE"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.version }}\"/" "$GRADLE"

      - name: Bundle JavaScript
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Configure debug signing for release
        run: |
          cat >> android/app/build.gradle << 'GRADLEOF'

          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLEOF

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          cp "$APK" "${{ steps.version.outputs.apk_name }}"
          echo "APK ready: ${{ steps.version.outputs.apk_name }}"
          ls -lh "${{ steps.version.outputs.apk_name }}"

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PruvYou v${{ steps.version.outputs.version }}
          body: |
            **PruvYou v${{ steps.version.outputs.version }}**
            Build: ${{ steps.version.outputs.build }} | Commit: ${{ steps.version.outputs.short_sha }}
            
            Download the APK below and install on your phone.
          files: ${{ steps.version.outputs.apk_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
