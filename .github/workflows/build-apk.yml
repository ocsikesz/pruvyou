name: Build Android APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compute version
        id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          BUILD=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Building PruvYou v${VERSION} (build ${BUILD})"

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: 1

      - name: Set versionCode and versionName
        run: |
          GRADLE=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ steps.version.outputs.build }}/" "$GRADLE"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.version }}\"/" "$GRADLE"

      - name: Setup release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/pruvyou.keystore
          echo "Keystore ready"
          keytool -keystore android/app/pruvyou.keystore -list -v \
            -alias upload -storepass pruvyou123 2>/dev/null | grep "SHA1:"

      - name: Configure release signing
        run: |
          cat >> android/app/build.gradle << 'GRADLEOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("pruvyou.keystore")
                      storePassword "pruvyou123"
                      keyAlias "upload"
                      keyPassword "pruvyou123"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLEOF

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Collect artifacts
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          cp "$APK" "pruvyou_v${{ steps.version.outputs.version }}.apk"
          ls -lh pruvyou_v${{ steps.version.outputs.version }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PruvYou v${{ steps.version.outputs.version }}
          body: |
            **PruvYou v${{ steps.version.outputs.version }}**
            Build: ${{ steps.version.outputs.build }} | Commit: ${{ steps.version.outputs.short_sha }}

            **APK** — install directly on your phone
          files: pruvyou_v${{ steps.version.outputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
