name: Get SHA1
on:
  workflow_dispatch:
jobs:
  sha1:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore and print SHA1
        run: |
          keytool -genkeypair -v \
            -keystore pruvyou.keystore \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass pruvyou123 -keypass pruvyou123 \
            -dname "CN=PruvYou, OU=Mobile, O=PruvYou, L=Bucuresti, S=Bucuresti, C=RO"
          echo "=== SHA1 ==="
          keytool -keystore pruvyou.keystore -list -v \
            -alias upload -storepass pruvyou123 2>/dev/null | grep "SHA1:"
          echo "=== BASE64 (salveaza asta!) ==="
          base64 -w 0 pruvyou.keystore
